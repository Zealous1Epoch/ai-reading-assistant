<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageOn</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- 发布物自包含铁律：不引任何外部字体/CDN，字体栈本地降级（Inter→system-ui，Noto Serif SC→Georgia/serif） -->
    <style>
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .font-serif-heading { font-family: 'Noto Serif SC', 'Georgia', serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 5px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .drop-zone { transition: all 0.3s ease; }
        .drop-zone.dragover { border-color: #18181b; background: #fafafa; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .typing-dot { animation: pulse-dot 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }
        .message-enter { animation: fade-in 0.2s ease-out; }
        .text-indent-2 { text-indent: 2em; }
        .book-columns { columns: 2; column-gap: 3rem; column-rule: 1px solid #f4f4f5; }
        @media (max-width: 980px) { .book-columns { columns: 1; } }
        .cite-marker { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 3px; margin: 0 2px; vertical-align: super; font-size: 10px; line-height: 1; border-radius: 9999px; background: #f4f4f5; color: #52525b; border: 1px solid #e4e4e7; cursor: pointer; transition: all 0.15s ease; }
        .cite-marker:hover { background: #18181b; color: #fff; border-color: #18181b; }
        /* v3.5 深色模式：引用角标与拖拽高亮换深色参数（这些是内联 style 硬编码，tailwind dark: 够不着） */
        .dark .cite-marker { background: #27272a; color: #a1a1aa; border-color: #3f3f46; }
        .dark .cite-marker:hover { background: #fafafa; color: #18181b; border-color: #fafafa; }
        .dark .drop-zone.dragover { border-color: #a1a1aa; background: #18181b; }
        .cite-flash { animation: cite-flash 3.2s ease-out; border-radius: 8px; }
        @keyframes cite-flash { 0% { background: transparent; } 8% { background: rgba(251, 191, 36, 0.5); } 60% { background: rgba(251, 191, 36, 0.35); } 100% { background: transparent; } }
        /* v3.6 多色高亮：色键与后端 HL_COLORS 一致；旧数据无 color → ReadingPane 归到 amber。
           笔记角标走 ::after，不进 DOM 文本（否则污染 collectSelection 的选区采集） */
        .hl-mark { border-radius: 2px; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background 0.15s ease; }
        .hl-mark.hl-c-amber { background: rgba(251, 191, 36, 0.3); }
        .hl-mark.hl-c-green { background: rgba(74, 222, 128, 0.32); }
        .hl-mark.hl-c-blue  { background: rgba(96, 165, 250, 0.32); }
        .hl-mark.hl-c-pink  { background: rgba(244, 114, 182, 0.3); }
        .hl-mark.hl-c-amber:hover { background: rgba(251, 191, 36, 0.55); }
        .hl-mark.hl-c-green:hover { background: rgba(74, 222, 128, 0.55); }
        .hl-mark.hl-c-blue:hover  { background: rgba(96, 165, 250, 0.55); }
        .hl-mark.hl-c-pink:hover  { background: rgba(244, 114, 182, 0.55); }
        .dark .hl-mark.hl-c-amber { background: rgba(251, 191, 36, 0.38); }
        .dark .hl-mark.hl-c-green { background: rgba(74, 222, 128, 0.34); }
        .dark .hl-mark.hl-c-blue  { background: rgba(96, 165, 250, 0.36); }
        .dark .hl-mark.hl-c-pink  { background: rgba(244, 114, 182, 0.34); }
        .hl-mark.hl-noted::after { content: '\270E'; font-size: 0.62em; vertical-align: super; margin-left: 1px; opacity: 0.7; }
        /* 选区条/划线菜单里的色板圆点（实色，比 mark 饱和） */
        .hl-swatch-amber { background: #fbbf24; }
        .hl-swatch-green { background: #4ade80; }
        .hl-swatch-blue  { background: #60a5fa; }
        .hl-swatch-pink  { background: #f472b6; }
        /* v3.5 纸张主题：变量由 ReadingPane 容器内联提供（appearance.js 的 PAPER_THEMES）。
           选择器两条 class + 元素，天然压过正文上的 text-zinc-700 等单 class 工具类。 */
        .reader-surface .reader-title { color: var(--paper-strong); }
        .reader-surface .reader-muted { color: var(--paper-muted) !important; }
        .reader-surface .reader-panel { background: var(--paper-panel); border-color: var(--paper-border); }
        .reader-surface .reader-navbtn { color: var(--paper-muted); }
        .reader-surface .reader-navbtn:hover:not(:disabled) { color: var(--paper-strong); background: var(--paper-panel); }
        .reader-surface .reader-body p { color: var(--paper-fg); font-size: var(--reader-fs); line-height: max(calc(var(--reader-fs) * 2.1), 32px); }
        .reader-surface .reader-fg { color: var(--paper-fg); }
        .reader-surface .reader-body .reader-heading { color: var(--paper-strong); font-size: calc(var(--reader-fs) + 3px); }
        /* 深色模式下细滚动条换深色药丸，避免黑底上一条白杠 */
        .dark .scrollbar-thin::-webkit-scrollbar-thumb { background: #3f3f46; }
        .dark .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
